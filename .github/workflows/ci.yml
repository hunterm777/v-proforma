name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  WASM_BINDGEN: "0.2.130"

jobs:
  rust:
    name: Rust core (fmt, clippy, tests, golden files, schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features proforma-core/schema -- -D warnings
      - run: cargo test --workspace --exclude proforma-python --features proforma-core/schema

  handcheck:
    name: Hand-checks (spreadsheet and independent reference model)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python -m pip install pyyaml
      - run: python tools/handcheck.py

  wasm:
    name: WASM parity and page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ env.WASM_BINDGEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: WASM fixture parity (Node, byte-identical to the native golden files)
        run: |
          cargo build -p proforma-wasm --target wasm32-unknown-unknown --profile wasm
          wasm-bindgen target/wasm32-unknown-unknown/wasm/proforma_wasm.wasm --target nodejs --out-dir crates/wasm/pkg-node
          node crates/wasm/tests/parity.mjs
      - name: Build the page (strict typecheck, bundle, offline checks)
        working-directory: web
        run: |
          npm ci
          npm run wasm
          npm run build
      - name: Speed and no-network checks
        working-directory: web
        run: CHROME="$(command -v google-chrome || command -v chromium)" npm run bench
      - uses: actions/upload-artifact@v4
        with:
          name: page
          path: web/dist

  python:
    name: Python ${{ matrix.python }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.13"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build the wheel, type-check, and run the tests (sockets are blocked in tests)
        shell: bash
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release -m crates/python/Cargo.toml --out wheels
          python -m pip install wheels/*.whl "pytest>=7" "pandas>=1.5" "mypy>=1.10"
          python -m pytest crates/python/tests -q
          python -m mypy --strict crates/python/python/proforma crates/python/tests
