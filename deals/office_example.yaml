# Example deal: six-tenant suburban office with rollover and mixed recovery
# structures. Made-up numbers. The equity waterfall is the PRD's five-tier example.
property:
  name: Lakeshore Commons
  type: office
  rentable_sf: 150000
  start_date: 2027-01-01
  hold_months: 84
rent_roll:
  - id: O1
    tenant: Westbridge Insurance
    suite: "400"
    sf: 42000
    start: 2021-07-01
    expiry: 2031-06-30
    rent_psf_yr: 31.50
    steps: { type: percent, rate: 0.025 }
    recovery: { type: base_year, year: 2021 }
    space_type: office
  - id: O2
    tenant: Northgate Engineering
    suite: "300"
    sf: 30000
    start: 2023-03-01
    expiry: 2030-02-28
    rent_psf_yr: 33.00
    steps: { type: fixed, amount_psf_yr: 0.75 }
    recovery: { type: base_year, year: 2023 }
    space_type: office
  - id: O3
    tenant: Calder & Moss LLP
    suite: "200"
    sf: 26000
    start: 2019-10-01
    expiry: 2028-09-30
    rent_psf_yr: 34.25
    steps: { type: percent, rate: 0.03 }
    recovery: { type: expense_stop, stop_psf_yr: 11.00 }
    space_type: office
    security_deposit: 85000
  - id: O4
    tenant: Fieldstone Health Partners
    suite: "150"
    sf: 22000
    start: 2025-05-01
    expiry: 2035-04-30
    rent_psf_yr: 29.00
    steps: { type: percent, rate: 0.03 }
    recovery: { type: nnn, cap_controllable_pct: 0.05 }
    space_type: office
  - id: O5
    tenant: Orbit Software
    suite: "120"
    sf: 18000
    start: 2024-01-01
    expiry: 2029-03-31
    rent_psf_yr: 32.00
    steps: { type: cpi, rates: [0.03, 0.025] }
    free_rent_months: 0
    recovery: { type: base_year, year: 2024 }
    space_type: office
  - id: O6
    tenant: Lakeshore Coffee
    suite: "100"
    sf: 3500
    start: 2022-01-01
    expiry: 2027-12-31
    rent_psf_yr: 27.00
    recovery: { type: gross }
    space_type: office
    market: { renewal_probability: 0.50, term_months: 36 }
market:
  - id: office
    market_rent_psf_yr: 33.50
    rent_growth: 0.03
    renewal_probability: 0.65
    downtime_months: 6
    term_months: 84
    new: { free_rent_months: 6, ti_psf: 45.0, lc_pct: 0.06 }
    renewal: { free_rent_months: 3, ti_psf: 20.0, lc_pct: 0.03 }
opex:
  management_fee_pct: 0.03
  lines:
    - { id: taxes, name: Real estate taxes, amount_yr: 870000, growth: 0.03, recoverable: true }
    - { id: insurance, name: Insurance, amount_yr: 120000, growth: 0.04, recoverable: true }
    - { id: cam, name: Common area maintenance, amount_yr: 540000, growth: 0.03, recoverable: true, controllable: true }
    - { id: utilities, name: Utilities, amount_yr: 345000, growth: 0.035, recoverable: true, controllable: true }
    - { id: admin, name: Non-recoverable administration, amount_yr: 60000, growth: 0.03, recoverable: false }
other_income:
  - { id: parking, name: Parking, amount_yr: 95000, growth: 0.02 }
revenue:
  general_vacancy_pct: 0.05
  credit_loss_pct: 0.01
capital:
  price: 36500000
  closing_costs: 730000
  reserves_per_sf_yr: 0.25
  capex:
    - { id: roof, name: Roof replacement, month: 9, amount: 600000 }
debt:
  sizing: { max_ltv: 0.60, min_dscr: 1.35, min_debt_yield: 0.09 }
  rate: { fixed: 0.0600 }
  io_months: 24
  amortization_years: 30
  origination_fee_pct: 0.01
  prepayment_penalty_pct: 0.01
exit:
  cap_rate: 0.0725
  selling_costs_pct: 0.02
equity:
  contributions: { lp: 0.90, gp: 0.10 }
  tiers:
    - name: Return of capital
      split: pro_rata
    - name: Preferred return
      hurdle: { type: irr, rate: 0.08, compounding: annual }
      split: pro_rata
    - name: GP catch-up
      split: { lp: 0.0, gp: 1.0 }
      until: { gp_share_of_profits: 0.20 }
    - name: Promote 1
      hurdle: { type: irr, rate: 0.12 }
      split: { lp: 0.80, gp: 0.20 }
    - name: Promote 2
      split: { lp: 0.70, gp: 0.30 }
